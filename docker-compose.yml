# Local smoke stack. Boots Postgres (with pgvector), Redis, the backend API,
# and the BullMQ worker so a `curl /healthz` proves the end-to-end wiring
# without any AWS resource. NOT for production; the ECS task definitions in
# infra/ecs/*.json own the deployed shape.
#
# Usage:
#   docker compose up --build -d
#   curl -sf http://localhost:4000/healthz

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: buttercupp
      POSTGRES_PASSWORD: buttercupp
      POSTGRES_DB: buttercupp_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buttercupp -d buttercupp_dev"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROCESS_ROLE: api
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://buttercupp:buttercupp@postgres:5432/buttercupp_dev?schema=public&pgbouncer=true&connect_timeout=15
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-please-override-me-please-please-please}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROCESS_ROLE: worker
      NODE_ENV: production
      DATABASE_URL: postgresql://buttercupp:buttercupp@postgres:5432/buttercupp_dev?schema=public&pgbouncer=true&connect_timeout=15
      REDIS_URL: redis://redis:6379
      MEDIA_WORKER_CONCURRENCY: "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
