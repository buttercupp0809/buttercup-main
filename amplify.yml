# AWS Amplify build spec for the Next.js 16 frontend (SSR / WEB_COMPUTE).
# Mirrors ../Pellow/amplify.yml. Key notes:
#   - appRoot: frontend  (monorepo)
#   - preBuild symlinks @buttercupp/database + @buttercupp/shared into the frontend's
#     node_modules AND copies the generated Prisma client + adapter-pg,
#     because Amplify's node_modules cache does not follow workspace links.
#   - build uses `next build --webpack`, NOT Turbopack: Turbopack currently
#     auto-externalizes native `.node` binaries (Prisma engines, sharp),
#     which breaks the SSR bundle in App Runner. Webpack keeps them bundled.
#   - server env vars are baked into `.next/server-env.json` so the runtime
#     picks them up without a re-read of process.env at cold start.
#
# Provisioning + env-var writes happen in the Amplify console; this file only
# describes the build.

version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - node -v
            - npm -v
            - cd ..
            # Install monorepo dependencies (workspaces).
            - npm ci --no-audit --no-fund
            # Regenerate Prisma client + build shared/database so their
            # dist/ output exists for the frontend to consume.
            - cd packages/shared && npx tsc && cd ../..
            - cd packages/database && npx prisma generate && npx tsc && cd ../..
            # Amplify does not preserve workspace symlinks; hydrate the
            # frontend's node_modules with a symlink to each workspace pkg.
            - mkdir -p frontend/node_modules/@buttercupp
            - ln -snf ../../../packages/database frontend/node_modules/@buttercupp/database
            - ln -snf ../../../packages/shared frontend/node_modules/@buttercupp/shared
            # Copy the generated Prisma client + adapter-pg + pg driver so
            # the SSR bundle can require them without workspace resolution.
            # Mirror Pellow's proven copy set. -L dereferences symlinks so the
            # real files (not workspace links) land in the bundle. adapter-pg and
            # its transitive deps may live in packages/database/node_modules when
            # not hoisted, so fall back to that path.
            - mkdir -p frontend/node_modules/@prisma
            - cp -RL node_modules/@prisma/client frontend/node_modules/@prisma/client || true
            - cp -RL node_modules/@prisma/adapter-pg frontend/node_modules/@prisma/adapter-pg 2>/dev/null || cp -RL packages/database/node_modules/@prisma/adapter-pg frontend/node_modules/@prisma/adapter-pg 2>/dev/null || true
            - cp -RL packages/database/node_modules/@prisma/driver-adapter-utils frontend/node_modules/@prisma/driver-adapter-utils 2>/dev/null || cp -RL node_modules/@prisma/driver-adapter-utils frontend/node_modules/@prisma/driver-adapter-utils 2>/dev/null || true
            # @prisma/engines carries the native query-engine .so.node binaries
            # (rhel-openssl-3.0.x / linux-arm64) that the library engine loads.
            - cp -RL node_modules/@prisma/engines frontend/node_modules/@prisma/engines 2>/dev/null || true
            - cp -RL node_modules/pg frontend/node_modules/pg 2>/dev/null || true
            # adapter-pg transitive deps (may be under packages/database/node_modules)
            - for pkg in postgres-array; do cp -RL packages/database/node_modules/$pkg frontend/node_modules/$pkg 2>/dev/null || cp -RL node_modules/$pkg frontend/node_modules/$pkg 2>/dev/null || true; done
            # The GENERATED client + native engine binary live in node_modules/.prisma/client
            # (NOT @prisma/client, which is just the wrapper). Since next.config
            # marks @prisma/client external, the runtime resolves .prisma/client
            # from node_modules and needs the engine .so.node file present there.
            - cp -RL node_modules/.prisma frontend/node_modules/.prisma || true
            - ls -la frontend/node_modules/.prisma/client/ | grep -E "engine|\.so|\.node" || echo "WARN no engine in .prisma/client"
            - cd frontend
        build:
          commands:
            # Clear stale webpack cache before each build (mirrors Pellow).
            - rm -rf .next/cache
            # Use webpack, not Turbopack. See top-of-file note.
            - npx next build --webpack
            # CRITICAL: Amplify WEB_COMPUTE ships only `.next/**` (the artifact
            # baseDirectory) to the Lambda. It discards frontend/node_modules
            # copies and does NOT copy Next's traced native Prisma engine. So
            # place the rhel engine INSIDE .next/ (guaranteed to ship); at
            # runtime client.ts points PRISMA_QUERY_ENGINE_LIBRARY at it
            # (cwd/.next/<engine>). Confirmed necessary via /api/debug: engine
            # was absent from the Lambda and Prisma searched non-existent paths.
            # Prisma searches for the native engine relative to the client
            # bundle. On the live Lambda (/api/debug) it searched
            # `/var/task/.next/server` and `/var/task/.prisma/client` but the
            # engine only existed in `.next/` (one dir up) -> "could not locate
            # the Query Engine for runtime rhel-openssl-3.0.x". Copy the engine
            # into EVERY location Prisma actually searches: .next/, .next/server/,
            # and .next/server/node_modules/.prisma/client/.
            - ENGINE=$(find node_modules/.prisma/client ../node_modules/.prisma/client -name "libquery_engine-rhel-openssl-3.0.x.so.node" 2>/dev/null | head -1)
            - 'echo "Prisma engine source=$ENGINE"'
            - mkdir -p .next/server/node_modules/.prisma/client
            - cp "$ENGINE" .next/ 2>/dev/null || echo "WARN engine not copied to .next"
            - cp "$ENGINE" .next/server/ 2>/dev/null || echo "WARN engine not copied to .next/server"
            - cp "$ENGINE" .next/server/node_modules/.prisma/client/ 2>/dev/null || echo "WARN engine not copied to .next/server/.prisma"
            - ls -la .next/libquery_engine-rhel-openssl-3.0.x.so.node .next/server/libquery_engine-rhel-openssl-3.0.x.so.node || echo "WARN engine missing after copy"
            # Bake server env into the build so the SSR runtime reads it from
            # disk via frontend/instrumentation.ts (register()). Amplify does
            # not reliably forward console env vars to the Next.js compute
            # runtime, so this bridge guarantees server-only reads work:
            #   - Prisma (DATABASE_URL), auth (JWT_SECRET)
            #   - CloudFront signed image URLs (lib/cdn.ts): CLOUDFRONT_URL +
            #     CLOUDFRONT_KEY_PAIR_ID + CLOUDFRONT_PRIVATE_KEY
            #   - S3 fallback proxy + blur: AWS_REGION, S3_BUCKET, POPPY_S3_BUCKET_GENERATED
            # Values come from the Amplify console env for this branch.
            - |
              node -e "
                const fs = require('fs');
                const keys = [
                  'DATABASE_URL',
                  'JWT_SECRET',
                  'AUTH_COOKIE_DOMAIN',
                  'NEXT_PUBLIC_APP_URL',
                  'NEXT_PUBLIC_BACKEND_URL',
                  'NEXT_PUBLIC_WS_URL',
                  'BACKEND_URL',
                  'CLOUDFRONT_URL',
                  'CLOUDFRONT_KEY_PAIR_ID',
                  'CLOUDFRONT_PRIVATE_KEY',
                  'AWS_REGION',
                  'S3_BUCKET',
                  'POPPY_S3_BUCKET_GENERATED',
                  'GOOGLE_CLIENT_ID',
                  'NEXT_PUBLIC_GOOGLE_CLIENT_ID',
                  'AGE_VERIFICATION_PROVIDER',
                  'RESEND_API_KEY',
                  'EMAIL_FROM',
                  'SENTRY_DSN',
                  'NEXT_PUBLIC_SENTRY_DSN',
                  'GOOGLE_CLIENT_SECRET',
                  'OPENROUTER_API_KEY',
                ];
                const out = Object.fromEntries(keys.map(k => [k, process.env[k] ?? null]));
                // AWS_REGION is a reserved prefix in Amplify and cannot be set as an env var.
                // We store it as APP_AWS_REGION and map it back here so the runtime sees AWS_REGION.
                if (!out['AWS_REGION'] && process.env['APP_AWS_REGION']) {
                  out['AWS_REGION'] = process.env['APP_AWS_REGION'];
                }
                fs.writeFileSync('.next/server-env.json', JSON.stringify(out, null, 2));
              "
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../node_modules/**/*
          - node_modules/**/*
          - .next/cache/**/*
